socket = "/tmp/nyttig.sock"
db_path = "~/.local/share/nyttig/nyttig.db"
log_level = "info"

# Refuse to fetch feeds from loopback, private, link-local and other
# non-public addresses. Turn this on when sources can be added through an
# internet-facing client such as nyttig-web, so a feed URL cannot be used to
# reach services inside your network (SSRF). HTTP proxy environment
# variables are ignored while it is on.
# block_private_addresses = true

# Mutual TLS. Uncomment to expose nyttigd over a TCP port securely: the daemon
# presents `cert`/`key` and only accepts clients holding a certificate signed
# by `client_ca`. For a remote server you would typically set
# socket = ":9090" above. Leave this table out for a plaintext local socket.
# [tls]
# cert = "~/.config/nyttig/certs/server.pem"
# key = "~/.config/nyttig/certs/server.key"
# client_ca = "~/.config/nyttig/certs/ca.pem"

[[sources]]
name = "Hacker News"
url = "https://news.ycombinator.com/rss"
refresh_sec = 600
type = "rss"
# color = "#FF6600"        # optional: hex color for source chip in TUI
# abbreviation = "HN"       # optional: short display name for TUI, falls back to name

[[sources]]
name = "Lobsters"
url = "https://lobste.rs/rss"
refresh_sec = 1800
type = "rss"
# color = "#A41E35"        # optional: hex color for source chip in TUI
# abbreviation = "LOB"     # optional: short display name for TUI

[[sources]]
name = "Go Blog"
url = "https://go.dev/blog/feed.atom"
refresh_sec = 3600
type = "atom"
# color = "#00ADD8"        # optional: hex color for source chip in TUI
# abbreviation = "Go"      # optional: short display name for TUI

[[tags]]
name = "rust"
color = "#FF6B35"

[[tags]]
name = "go"
color = "#00ADD8"

[[tags]]
name = "database"
color = "#336791"

[[tags]]
name = "linux"
color = "#FCC624"

[[tag_rules]]
tag = "rust"
pattern = "(?i)\\brust\\b"
field = "both"

[[tag_rules]]
tag = "go"
pattern = "(?i)\\bgolang?\\b"
field = "both"

[[tag_rules]]
tag = "database"
pattern = "(?i)(sqlite|postgres|mysql|mariadb|database|db|nosql)"
field = "both"

[[tag_rules]]
tag = "linux"
pattern = "(?i)\\blinux\\b"
field = "both"

