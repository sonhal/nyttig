socket = "/tmp/nyttig.sock"
db_path = "~/.local/share/nyttig/nyttig.db"
log_level = "info"

# Refuse to fetch feeds from loopback, private, link-local and other
# non-public addresses. Turn this on when sources can be added through an
# internet-facing client such as nyttig-api, so a feed URL cannot be used to
# reach services inside your network (SSRF). HTTP proxy environment
# variables are ignored while it is on.
# block_private_addresses = true

# Mutual TLS. Uncomment to expose nyttigd over a TCP port securely: the daemon
# presents `cert`/`key` and only accepts clients holding a certificate signed
# by `client_ca`. Set `listen` to serve mTLS on a TCP port while local
# clients (such as nyttig-api) keep using the Unix socket above; without it,
# TLS applies to `socket`, which you would then set to e.g. ":9090".
# Leave this table out for a plaintext local socket.
# [tls]
# cert = "~/.config/nyttig/certs/server.pem"
# key = "~/.config/nyttig/certs/server.key"
# client_ca = "~/.config/nyttig/certs/ca.pem"
# listen = ":9090"

[[sources]]
name = "Hacker News"
url = "https://news.ycombinator.com/rss"
refresh_sec = 600
type = "rss"
# color = "#FF6600"        # optional: hex color for source chip in TUI
# abbreviation = "HN"       # optional: short display name for TUI, falls back to name

[[sources]]
name = "Lobsters"
url = "https://lobste.rs/rss"
refresh_sec = 1800
type = "rss"
# color = "#A41E35"        # optional: hex color for source chip in TUI
# abbreviation = "LOB"     # optional: short display name for TUI

[[sources]]
name = "Go Blog"
url = "https://go.dev/blog/feed.atom"
refresh_sec = 3600
type = "atom"
# color = "#00ADD8"        # optional: hex color for source chip in TUI
# abbreviation = "Go"      # optional: short display name for TUI

# A Bluesky account's own posts (no replies or reposts). Use the account's DID
# in the URL: it survives a handle change. A handle URL such as
# https://bsky.app/profile/alice.bsky.social also works, but breaks if the
# account renames. nyttigd does not look handles up at startup. To find a DID,
# run `nyttig add-source -t bluesky -u alice.bsky.social` and read it from
# `nyttig list-sources`, or open
# https://public.api.bsky.app/xrpc/app.bsky.actor.getProfile?actor=alice.bsky.social
# [[sources]]
# name = "Alice"
# url = "https://bsky.app/profile/did:plc:z72i7hdynmk6r22z27h6tvur"
# type = "bluesky"
# refresh_sec = 900

# The EU Vulnerability Database (EUVD): exploited vulnerabilities when url is
# left out, or any https://euvdservices.enisa.europa.eu/api/search?... query.
# Scores become the euvd-cvss and euvd-epss assessors' assessments.
# [[sources]]
# type = "euvd"
# refresh_sec = 21600

[[tags]]
name = "rust"
color = "#FF6B35"

[[tags]]
name = "go"
color = "#00ADD8"

[[tags]]
name = "database"
color = "#336791"

[[tags]]
name = "linux"
color = "#FCC624"

# A tag can have parents (several, even). Filtering by "cyber security" also
# shows items tagged "CVE" or "linux security"; filtering by "linux" also shows
# "linux security". Parents may be declared anywhere in the file, and a name
# that is not declared is created. Any tag can have its own rules.
[[tags]]
name = "cyber security"
color = "#D7263D"

[[tags]]
name = "CVE"
parents = ["cyber security"]

[[tags]]
name = "linux security"
parents = ["cyber security", "linux"]

[[tag_rules]]
tag = "rust"
pattern = "(?i)\\brust\\b"
field = "both"

[[tag_rules]]
tag = "go"
pattern = "(?i)\\bgolang?\\b"
field = "both"

[[tag_rules]]
tag = "database"
pattern = "(?i)(sqlite|postgres|mysql|mariadb|database|db|nosql)"
field = "both"

[[tag_rules]]
tag = "linux"
pattern = "(?i)\\blinux\\b"
field = "both"


[[tag_rules]]
tag = "CVE"
pattern = "(?i)\\bCVE-\\d{4}-\\d{4,}\\b"
field = "both"

[[tag_rules]]
tag = "linux security"
pattern = "(?i)\\blinux\\b.*\\b(vulnerabilit|exploit|privilege escalation)"
field = "both"

# Assessors score items through the API (a model, a CVE reader, you). The
# description says what the score means; it is shown next to the scores.
# An assessor that already exists is left as it is. See "Assessments" in the
# README for how to write one.
[[assessors]]
name = "claude"
description = "How much the item matters for its tag, 0 to 1"
color = "#D97757"

[[assessors]]
name = "cvss"
description = "CVSS base score divided by 10"
