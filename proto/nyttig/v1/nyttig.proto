syntax = "proto3";

package nyttig.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/sonhal/nyttig/internal/proto/nyttig/v1";

// ── Common types ────────────────────────────────────────────

message Source {
    int64  id          = 1;
    string name        = 2;
    string url         = 3;
    string type        = 4;  // rss, atom, bluesky, euvd
    int32  refresh_sec = 5;
    bool   enabled     = 6;
    google.protobuf.Timestamp created_at = 7;
    google.protobuf.Timestamp last_fetch = 8;
    string fetch_error = 9;
    string color       = 10;  // hex color, e.g. "#FF6600"
    string abbreviation = 11;  // short display name
}

message Item {
    int64  id          = 1;
    int64  source_id   = 2;
    string source_name = 3;
    string guid        = 4;
    string link        = 5;
    string title       = 6;
    string description = 7;
    string author      = 8;
    google.protobuf.Timestamp published  = 9;
    google.protobuf.Timestamp fetched_at = 10;
    repeated Tag tags  = 11;
    bool   viewed      = 12;
    repeated Assessment assessments = 13;  // every assessor's, by assessor name
    ArchiveInfo archive = 14;              // unset = never archived
}

// ArchiveInfo is what an item row needs to know about its archive.
message ArchiveInfo {
    int64  id     = 1;
    string status = 2;  // pending, running, done, partial or failed
}

message Tag {
    int64  id    = 1;
    string name  = 2;
    string color = 3;  // hex color, e.g. "#FF6B35"
    repeated int64 parent_ids = 4;  // direct parents; empty = top-level
}

// Assessor is a registered system (a model, a CVE reader, you) that writes
// assessments. description says what its score means.
message Assessor {
    int64  id          = 1;
    string name        = 2;
    string description = 3;
    string color       = 4;  // hex color, e.g. "#FF6B35"
    google.protobuf.Timestamp created_at = 5;
}

// Assessment is one assessor's judgement on an item: an optional score from
// 0 to 1 and an optional note, for one tag or for the item as a whole.
// Notes are untrusted text.
message Assessment {
    int64  id            = 1;
    int64  item_id       = 2;
    int64  assessor_id   = 3;
    string assessor_name = 4;
    int64  tag_id        = 5;  // 0 = the item as a whole
    optional double score = 6;  // unset = no score (0 is a score)
    string note          = 7;
    google.protobuf.Timestamp updated_at = 8;
}

message TagRule {
    int64  id        = 1;
    int64  source_id = 2;  // 0 = global
    int64  tag_id    = 3;
    string tag_name  = 4;
    string field     = 5;  // title, description, both
    string pattern   = 6;  // regex pattern
    int32  priority  = 7;
}

// ── Source management ───────────────────────────────────────

message AddSourceRequest {
    string name        = 1;
    string url         = 2;
    string type        = 3;  // rss, atom, bluesky, euvd; defaults to "rss"
    int32  refresh_sec = 4;
    bool   enabled     = 5;
    string color       = 6;  // optional hex color for source chip
    string abbreviation = 7;  // optional short display name
}

message RemoveSourceRequest {
    int64 id = 1;
}

// UpdateSourceRequest patches a source. Every mutable field has explicit
// presence: an unset field is left unchanged, a set field is written. For
// color and abbreviation, setting an empty string clears the value.
message UpdateSourceRequest {
    int64           id           = 1;
    optional string name         = 2;
    optional string url          = 3;
    optional string type         = 4;
    optional int32  refresh_sec  = 5;
    optional bool   enabled      = 6;
    optional string color        = 7;
    optional string abbreviation = 8;
}

message ListSourcesResponse {
    repeated Source sources = 1;
}

message RefreshSourceRequest {
    int64 source_id = 1;  // 0 = all sources
}

// ── Tag management ──────────────────────────────────────────

message AddTagRequest {
    string name  = 1;
    string color = 2;
    repeated int64 parent_ids = 3;
}

// TagParents wraps a parent set to give it presence: a repeated field cannot
// be optional in proto3, and UpdateTagRequest needs "unset" (unchanged) to
// differ from "set to empty" (make top-level).
message TagParents {
    repeated int64 ids = 1;
}

// UpdateTagRequest patches a tag. Unset fields are left unchanged; setting
// color to an empty string clears it. A set parents replaces the whole
// parent set.
message UpdateTagRequest {
    int64           id      = 1;
    optional string name    = 2;
    optional string color   = 3;
    optional TagParents parents = 4;
}

message RemoveTagRequest {
    int64 id = 1;
}

message ListTagsResponse {
    repeated Tag tags = 1;
}

// ── Saved views ─────────────────────────────────────────────

// ViewFilter is the feed filter a saved view holds. Zero values mean "not
// filtered": source_id/tag_id 0 = any, sort "" = newest.
message ViewFilter {
    string search = 1;
    int64 source_id = 2;
    int64 tag_id = 3;
    string sort = 4;          // "newest" (default), "oldest" or "score"
    bool unviewed_only = 5;
    string since = 6;         // rolling window: "24h", "7d", "2w", "1mo", "1y"; "" = no window
    int64 assessor_id = 7;    // 0 = none; whose scores min_score and sort "score" use
    optional double min_score = 8;
    int64 unassessed_by = 9;  // 0 = none
    // The feed columns to show: canonical names (date, source, tags, score,
    // title, desc, domain) in display order; empty = all columns. Display
    // only: the daemon stores it and never filters by it.
    repeated string columns = 10;
}

message SavedView {
    int64 id = 1;
    string name = 2;
    ViewFilter filter = 3;
    bool favorite = 4;
    int32 position = 5;
}

message AddSavedViewRequest {
    string name = 1;
    ViewFilter filter = 2;
    bool favorite = 3;
}

// Unset fields are unchanged. A filter that is set replaces the whole saved
// filter.
message UpdateSavedViewRequest {
    int64 id = 1;
    optional string name = 2;
    ViewFilter filter = 3;
    optional bool favorite = 4;
}

message RemoveSavedViewRequest {
    int64 id = 1;
}

// ids must list every saved view exactly once, in the new order.
message ReorderSavedViewsRequest {
    repeated int64 ids = 1;
}

message ListSavedViewsResponse {
    repeated SavedView views = 1;
}

// ── Assessors and assessments ───────────────────────────────

message AddAssessorRequest {
    string name        = 1;
    string description = 2;
    string color       = 3;
}

// Unset fields are unchanged; setting description or color to an empty
// string clears it.
message UpdateAssessorRequest {
    int64           id          = 1;
    optional string name        = 2;
    optional string description = 3;
    optional string color       = 4;
}

message RemoveAssessorRequest {
    int64 id = 1;
}

message ListAssessorsResponse {
    repeated Assessor assessors = 1;
}

// Replaces the whole assessment for (item_id, assessor_id, tag_id): an unset
// score or empty note is stored as NULL. At least one must be given.
// tag_id 0 = the item as a whole.
message PutAssessmentRequest {
    int64 item_id     = 1;
    int64 assessor_id = 2;
    int64 tag_id      = 3;
    optional double score = 4;
    string note       = 5;
}

message RemoveAssessmentRequest {
    int64 item_id     = 1;
    int64 assessor_id = 2;
    int64 tag_id      = 3;
}

// ── Tag rules ───────────────────────────────────────────────

message AddTagRuleRequest {
    int64  source_id = 1;  // 0 = global
    int64  tag_id    = 2;
    string field     = 3;  // title, description, both
    string pattern   = 4;
    int32  priority  = 5;
}

message RemoveTagRuleRequest {
    int64 id = 1;
}

message ListTagRulesResponse {
    repeated TagRule rules = 1;
}

// TestTagRuleRequest dry-runs a rule against recently fetched items without
// saving it. The pattern is validated exactly as AddTagRule validates it.
message TestTagRuleRequest {
    int64  source_id = 1;  // 0 = items from all sources
    string field     = 2;  // title, description, both; defaults to "both"
    string pattern   = 3;
    int32  limit     = 4;  // max matches to return; default 20, max 100
}

message TestTagRuleResponse {
    repeated Item items   = 1;  // matching items, newest first
    int32         scanned = 2;  // how many recent items were checked
}

// ── Full-text search ────────────────────────────────────────

message SearchRequest {
    string query     = 1;
    int64  source_id = 2;  // 0 = all sources
    int64  tag_id    = 3;  // 0 = all tags; matches the tag or any tag below it
    int32  limit     = 4;  // default: 100
    int32  offset    = 5;  // default: 0
    string sort      = 6;  // newest, oldest, score; default newest
    bool   unviewed_only = 7;
    bool   tag_exact = 8;  // match tag_id only, not its descendants
    google.protobuf.Timestamp after = 9;  // only items dated at or after this (published, else fetched); unset = no window
    int64  assessor_id = 10;   // 0 = none; whose scores min_score and sort "score" use
    optional double min_score = 11;  // an in-scope score from assessor_id of at least this
    int64  unassessed_by = 12;  // 0 = none; no in-scope assessment by this assessor
}

message SearchResponse {
    repeated Item items = 1;
    int32         total = 2;
}

// ── View tracking ───────────────────────────────────────────

message MarkViewedRequest {
    repeated int64 item_ids = 1;
}

// ── StreamItems (bidirectional) ─────────────────────────────

message ClientMessage {
    oneof msg {
        StreamFilter filter = 1;
    }
}

message StreamFilter {
    int64  source_id = 1;  // 0 = all
    int64  tag_id    = 2;  // 0 = all; matches the tag or any tag below it
    string search    = 3;  // FTS5 query string, empty = no filter
    string sort      = 4;  // newest, oldest, score; default newest
    int32  limit     = 5;
    bool   unviewed_only = 6;
    google.protobuf.Timestamp after = 7;  // only items dated at or after this (published, else fetched); unset = no window
    int64  assessor_id = 8;   // 0 = none; whose scores min_score and sort "score" use
    optional double min_score = 9;
    int64  unassessed_by = 10;  // 0 = none
}

message ServerMessage {
    oneof msg {
        Item     item     = 1;
        Reset    reset    = 2;
        Complete complete = 3;
        Item     item_update = 4;  // an item whose assessments changed, with all of them
    }
    // Only with item_update: whether the item matches the stream's current
    // filter. A client replaces an item_update it shows, and inserts one it
    // does not show only when this is true. It never removes an item.
    bool update_matches = 5;
}

message Reset {}
message Complete {}

// ── Service definition ──────────────────────────────────────

// ── Digests ─────────────────────────────────────────────────────────────────

// A named, registered group of digests by one assessor.
message DigestSeries {
    int64  id            = 1;
    int64  assessor_id   = 2;
    string assessor_name = 3;
    string name          = 4;
    string description   = 5;
    int32  position      = 6;
    google.protobuf.Timestamp created_at = 7;
    int32  digest_count  = 8;
    google.protobuf.Timestamp latest_period_end = 9;  // unset when empty
}

// An item a digest links to.
message DigestItem {
    int64  item_id     = 1;
    string title       = 2;
    string link        = 3;
    string source_name = 4;
    google.protobuf.Timestamp published = 5;
}

// An earlier digest used as input.
message DigestRef {
    int64  id          = 1;
    string title       = 2;
    string series_name = 3;
    google.protobuf.Timestamp period_end = 4;
}

// A document an assessor wrote about one to many items. The body is untrusted
// text (a Markdown subset).
message Digest {
    int64  id            = 1;
    int64  series_id     = 2;
    string series_name   = 3;
    int64  assessor_id   = 4;
    string assessor_name = 5;
    string title         = 6;
    string body          = 7;   // empty in lists without include_body
    google.protobuf.Timestamp period_start = 8;
    google.protobuf.Timestamp period_end   = 9;
    google.protobuf.Timestamp created_at   = 10;
    google.protobuf.Timestamp updated_at   = 11;
    repeated DigestItem items  = 12;
    repeated DigestRef  inputs = 13;
}

message AddDigestSeriesRequest    { int64 assessor_id = 1; string name = 2; string description = 3; }
message UpdateDigestSeriesRequest { int64 id = 1; optional string name = 2; optional string description = 3; }
message RemoveDigestSeriesRequest { int64 id = 1; }
message ListDigestSeriesRequest   { int64 assessor_id = 1; }  // 0 = all
message ListDigestSeriesResponse  { repeated DigestSeries series = 1; }
message ReorderDigestSeriesRequest { repeated int64 ids = 1; }

// Wrapper for field presence in updates.
message IDList { repeated int64 ids = 1; }

message AddDigestRequest {
    int64  series_id = 1;
    string title     = 2;
    string body      = 3;
    google.protobuf.Timestamp period_start = 4;
    google.protobuf.Timestamp period_end   = 5;
    repeated int64 item_ids  = 6;
    repeated int64 input_ids = 7;
}
message UpdateDigestRequest {
    int64 id = 1;
    optional string title = 2;
    optional string body  = 3;
    google.protobuf.Timestamp period_start = 4;  // unset = unchanged
    google.protobuf.Timestamp period_end   = 5;  // unset = unchanged
    IDList item_ids  = 6;                         // unset = unchanged, empty = none
    IDList input_ids = 7;
}
message RemoveDigestRequest { int64 id = 1; }
message GetDigestRequest    { int64 id = 1; }
message ListDigestsRequest  {
    int64 series_id    = 1;
    int64 before_id    = 2;  // cursor; 0 = from the newest
    int32 limit        = 3;  // 0 = 20, at most 100
    bool  include_body = 4;
}
message ListDigestsResponse { repeated Digest digests = 1; bool has_more = 2; }

// Archive is a self-contained copy of the article behind an item, kept on
// the daemon's disk. It outlives its item: link, title and source_name are
// copies, and item_id is 0 once the item is gone.
message Archive {
    int64  id             = 1;
    int64  item_id        = 2;
    string link           = 3;
    string title          = 4;   // untrusted text
    string source_name    = 5;
    string status         = 6;   // pending, running, done, partial or failed
    string error          = 7;   // why it failed; untrusted text
    string note           = 8;   // warning on a saved page, such as "little text"
    string final_url      = 9;   // after redirects
    string content_type   = 10;  // "text/html; charset=utf-8" or "application/pdf"
    int32  http_status    = 11;
    int64  size           = 12;  // bytes stored (compressed)
    int64  original_size  = 13;  // bytes of the page itself
    int32  missing_assets = 14;  // images, styles or fonts that could not be saved
    google.protobuf.Timestamp requested_at = 15;
    google.protobuf.Timestamp started_at   = 16;
    google.protobuf.Timestamp finished_at  = 17;
}

message ArchiveItemRequest   { int64 item_id = 1; }
message GetArchiveRequest    { int64 id = 1; }
message RemoveArchiveRequest { int64 id = 1; }
message ListArchivesRequest  {
    string status    = 1;  // "" = every status
    int64  before_id = 2;  // cursor; 0 = from the newest
    int32  limit     = 3;  // 0 = 50, at most 200
}
message ListArchivesResponse { repeated Archive archives = 1; bool has_more = 2; }
message GetArchiveContentRequest { int64 id = 1; }
// ArchiveContentChunk is up to 1 MiB of the uncompressed file. The content
// type is in the Archive (GetArchive).
message ArchiveContentChunk { bytes data = 1; }

// ── Version ─────────────────────────────────────────────────
message GetVersionResponse {
    string version = 1;  // the daemon's build: a release tag, a Go pseudo-version, or "dev"
}


service Nyttig {
    // Source management
    rpc AddSource(AddSourceRequest) returns (Source);
    rpc RemoveSource(RemoveSourceRequest) returns (google.protobuf.Empty);
    rpc UpdateSource(UpdateSourceRequest) returns (Source);
    rpc ListSources(google.protobuf.Empty) returns (ListSourcesResponse);
    rpc RefreshSource(RefreshSourceRequest) returns (google.protobuf.Empty);

    // Tag management
    rpc AddTag(AddTagRequest) returns (Tag);
    rpc UpdateTag(UpdateTagRequest) returns (Tag);
    rpc RemoveTag(RemoveTagRequest) returns (google.protobuf.Empty);
    rpc ListTags(google.protobuf.Empty) returns (ListTagsResponse);

    // Tag rules
    rpc AddTagRule(AddTagRuleRequest) returns (TagRule);
    rpc RemoveTagRule(RemoveTagRuleRequest) returns (google.protobuf.Empty);
    rpc ListTagRules(google.protobuf.Empty) returns (ListTagRulesResponse);
    rpc TestTagRule(TestTagRuleRequest) returns (TestTagRuleResponse);

    // Saved views
    rpc AddSavedView(AddSavedViewRequest) returns (SavedView);
    rpc UpdateSavedView(UpdateSavedViewRequest) returns (SavedView);
    rpc RemoveSavedView(RemoveSavedViewRequest) returns (google.protobuf.Empty);
    rpc ListSavedViews(google.protobuf.Empty) returns (ListSavedViewsResponse);
    rpc ReorderSavedViews(ReorderSavedViewsRequest) returns (ListSavedViewsResponse);

    // Assessors and assessments
    rpc AddAssessor(AddAssessorRequest) returns (Assessor);
    rpc UpdateAssessor(UpdateAssessorRequest) returns (Assessor);
    rpc RemoveAssessor(RemoveAssessorRequest) returns (google.protobuf.Empty);
    rpc ListAssessors(google.protobuf.Empty) returns (ListAssessorsResponse);
    rpc PutAssessment(PutAssessmentRequest) returns (Assessment);
    rpc RemoveAssessment(RemoveAssessmentRequest) returns (google.protobuf.Empty);

    // Digests: documents about many items, kept in series
    rpc AddDigestSeries(AddDigestSeriesRequest) returns (DigestSeries);
    rpc UpdateDigestSeries(UpdateDigestSeriesRequest) returns (DigestSeries);
    rpc RemoveDigestSeries(RemoveDigestSeriesRequest) returns (google.protobuf.Empty);
    rpc ListDigestSeries(ListDigestSeriesRequest) returns (ListDigestSeriesResponse);
    rpc ReorderDigestSeries(ReorderDigestSeriesRequest) returns (ListDigestSeriesResponse);
    rpc AddDigest(AddDigestRequest) returns (Digest);
    rpc UpdateDigest(UpdateDigestRequest) returns (Digest);
    rpc RemoveDigest(RemoveDigestRequest) returns (google.protobuf.Empty);
    rpc GetDigest(GetDigestRequest) returns (Digest);
    rpc ListDigests(ListDigestsRequest) returns (ListDigestsResponse);

    // Archives: self-contained copies of the articles behind items
    rpc ArchiveItem(ArchiveItemRequest) returns (Archive);
    rpc ListArchives(ListArchivesRequest) returns (ListArchivesResponse);
    rpc GetArchive(GetArchiveRequest) returns (Archive);
    rpc GetArchiveContent(GetArchiveContentRequest) returns (stream ArchiveContentChunk);
    rpc RemoveArchive(RemoveArchiveRequest) returns (google.protobuf.Empty);

    // Core feed stream (bidirectional)
    rpc StreamItems(stream ClientMessage) returns (stream ServerMessage);

    // Full-text search
    rpc Search(SearchRequest) returns (SearchResponse);

    // View tracking
    rpc MarkViewed(MarkViewedRequest) returns (google.protobuf.Empty);

    // The daemon's version
    rpc GetVersion(google.protobuf.Empty) returns (GetVersionResponse);
}
