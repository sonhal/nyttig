version: v2
# Run from the repository root: buf generate
#
# Local plugins keep generation offline and reproducible. Install the pinned
# versions first; CI's "Generated code" job uses the same ones:
#   go install github.com/bufbuild/buf/cmd/buf@v1.73.0
#   go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
#   go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
# Managed mode stays off: the proto's own go_package option is authoritative.
plugins:
  - local: protoc-gen-go
    out: internal/proto
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/proto
    opt:
      - paths=source_relative
