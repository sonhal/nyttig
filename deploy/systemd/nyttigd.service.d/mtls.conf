# Drop-in for nyttigd.service: hands the mTLS files to the daemon for the
# TUI listener ([tls] listen = ":9090" in /etc/nyttig/config.toml).
#
#   sudo install -D -m 0644 deploy/systemd/nyttigd.service.d/mtls.conf \
#     /etc/systemd/system/nyttigd.service.d/mtls.conf
#
# The files stay root-only (0600) in /etc/nyttig/tls; systemd copies them
# into /run/credentials/nyttigd.service/, readable only by this service.
# The unit fails to start while any of them is missing.

[Service]
LoadCredential=server.pem:/etc/nyttig/tls/server.pem
LoadCredential=server.key:/etc/nyttig/tls/server.key
LoadCredential=ca.pem:/etc/nyttig/tls/ca.pem
