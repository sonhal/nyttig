# Opt-in: the Clef assessor (nyttig-clef) scores news items with Cloudflare's
# Clef models and writes the scores to nyttigd as assessments. Turn it on
# with both files, e.g. in .env:
#
#   COMPOSE_FILE=compose.yaml:compose.clef.yaml
#
# Before the first start (README.md, "The Clef assessor"):
#   - put the Cloudflare API token (Workers AI: Read only) in ./clef-token,
#     readable by uid 10001;
#   - set account_id and view, and write your questions, in ./clef.toml;
#   - create the assessor and the saved view it reads.
#
# nyttig-clef reaches nyttigd only through the Unix socket in the
# nyttig-socket volume. Its own network, "clef", gives it outbound HTTPS to
# api.cloudflare.com and nothing else; no ports are published. The item text
# it scores is sent to Cloudflare.

services:
  nyttig-clef:
    # compose.yaml's *hardening anchor doesn't reach this file (YAML anchors
    # stop at the file's end), so the settings are repeated. Keep them in step.
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    image: ghcr.io/sonhal/nyttig-clef:${NYTTIG_VERSION:-latest}
    build:
      context: ../..
      target: nyttig-clef
    # The image runs as uid 10001, the only one that may use the socket, and
    # its default command is --config /etc/nyttig/clef.toml.
    depends_on: [nyttigd]
    volumes:
      - nyttig-socket:/run/nyttig
      - ./clef.toml:/etc/nyttig/clef.toml:ro
    secrets:
      - cf-token
    networks: [clef]

secrets:
  # Mounted at /run/secrets/cf-token with the file's own owner and mode, so
  # it must be readable by uid 10001: sudo chown 10001:10001 clef-token &&
  # sudo chmod 0400 clef-token
  cf-token:
    file: ./clef-token

networks:
  clef:
