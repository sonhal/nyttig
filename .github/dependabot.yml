version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Replaced by the patched copy in third_party/ (see AGENT.md); a bump
      # here would change nothing that gets built.
      - dependency-name: github.com/mattn/go-sqlite3
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # The web client (web/, pnpm). Dependencies only run at build time, but
  # they end up in the embedded bundle, so keep them current.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns: ["*"]
