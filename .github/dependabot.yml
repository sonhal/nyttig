version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # The web client (web/, pnpm). Dependencies only run at build time, but
  # they end up in the embedded bundle, so keep them current.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # svelte-check only runs on TypeScript 7 alongside TypeScript 6 and
      # behind its experimental --tsgo flag; stay on 6 until it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web-dependencies:
        patterns: ["*"]
