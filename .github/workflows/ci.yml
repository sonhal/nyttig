name: CI

on:
  push:
    branches: [main]
    # A version tag runs the whole pipeline and then publishes a GitHub
    # Release with the deployable bundle (the release job at the end).
    tags: ['v*']
  pull_request:
  # Also how the Tag job starts the release run for the tag it pushes.
  workflow_dispatch:

# Least privilege: jobs only need to read the repo. golangci-lint's
# only-new-issues additionally reads the PR diff through the API.
permissions:
  contents: read

# Cancel superseded runs on the same PR/branch, but never on main so every
# commit there gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      # Skipped for v* tags: only-new-issues needs a baseline (the PR base or
      # the push's previous commit), and a new tag has none, so the action
      # would lint the whole codebase and fail on the existing backlog. The
      # tagged commit was already linted on its PR and its push to main.
      - name: golangci-lint
        if: github.ref_type != 'tag'
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # The codebase has existing findings; only fail on ones a change
          # introduces. Drop this once the backlog is cleared.
          only-new-issues: true

  generated:
    name: Generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Pinned to the versions in buf.gen.yaml's header comment. Keep them in
      # sync when bumping, or this job reports a diff.
      - name: Install buf and protoc plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      # protobuf-go serializes from the descriptor embedded in the generated
      # code, so a hand edit to *.pb.go silently drops fields on the wire.
      - name: Check generated code is up to date
        run: |
          buf generate
          if ! git diff --exit-code -- internal/proto; then
            echo "::error::internal/proto is out of date with proto/. Run 'buf generate' and commit the result."
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # SQLite is compiled in through cgo; the race detector needs it too.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # sqlite_fts5 compiles go-sqlite3's bundled SQLite with FTS5, which the
      # schema needs; the release build links the server's libsqlite3 instead
      # (the Build job below).
      - name: go test
        run: go test -race -shuffle=on -tags sqlite_fts5 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  web:
    name: Web
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned by web/package.json's packageManager.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The end-to-end tests build and run nyttigd and nyttig-api.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm check

      - name: vitest
        run: pnpm test

      - name: vite build
        run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm test:e2e

      # The SvelteKit Node server (deploy/systemd/nyttig-web.service).
      - uses: actions/upload-artifact@v7
        with:
          name: nyttig-web
          path: |
            web/build/
            web/package.json
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, web]
    # nyttigd uses cgo and, with the libsqlite3 tag below, the system's
    # SQLite, so it only runs where glibc and libsqlite3 are the same version
    # as the ones it was built against or newer. Build on the servers' Debian
    # release (deploy/README.md) instead of the runner's Ubuntu.
    container: golang:1.26-trixie
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      # The workspace is owned by the runner's user, not the container's root;
      # without this git refuses it and go build can't stamp VCS info.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Headers for the libsqlite3 build tag. Debian's libsqlite3 is built
      # with FTS5; nyttigd checks that at startup.
      - name: Install libsqlite3-dev
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev

      # The image's Go may be older than go.mod's toolchain line; the go
      # command then downloads that toolchain itself (GOTOOLCHAIN=auto).
      # A v* tag is stamped in as the version (nyttigd -version, and the
      # startup logs); other builds report the git pseudo-version go build
      # records (internal/version).
      #
      # -tags libsqlite3 links the system SQLite (package libsqlite3-0 on the
      # server, which apt keeps patched) instead of compiling go-sqlite3's
      # bundled copy into the binary.
      - name: go build
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          mkdir -p dist
          go build -trimpath -tags libsqlite3 \
            -ldflags="-s -w -X github.com/sonhal/nyttig/internal/version.Version=$VERSION" \
            -o dist/ ./cmd/nyttig ./cmd/nyttigd ./cmd/nyttig-api
          dist/nyttigd -version
          # Prove nyttigd links the system library rather than a bundled copy.
          ldd dist/nyttigd | grep -q libsqlite3

      - uses: actions/upload-artifact@v7
        with:
          name: nyttig-linux-amd64
          path: dist/
          retention-days: 14

  # The container images (Dockerfile, deploy/docker/), built and started on
  # every run so a broken Dockerfile fails the PR. publish-images pushes them
  # for v* tags; on a tag run this build stamps the same VERSION, so the
  # publish rebuild comes from this cache.
  images:
    name: Image (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint, test, web]
    strategy:
      fail-fast: false
      matrix:
        target: [nyttigd, nyttig-api, nyttig-web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          tags: nyttig-ci/${{ matrix.target }}
          load: true
          cache-from: type=gha,scope=image-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.target }}

      # Each image starts as compose runs it: read-only, no capabilities.
      # nyttigd also serves mutual TLS (compose.mtls.yaml), with
      # certificates from scripts/gen-certs.sh.
      - name: Smoke test
        env:
          TARGET: ${{ matrix.target }}
        run: |
          run=(docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true)
          case "$TARGET" in
            nyttigd)
              "${run[@]}" "nyttig-ci/$TARGET" -version
              scripts/gen-certs.sh "$RUNNER_TEMP/certs" >/dev/null
              scripts/gen-certs.sh "$RUNNER_TEMP/certs/other" >/dev/null   # a CA nyttigd doesn't trust
              chmod 0644 "$RUNNER_TEMP"/certs/*.key "$RUNNER_TEMP"/certs/other/*.key   # readable by the image's uid
              # Opens its database in the volume, its socket in the tmpfs
              # (as compose's nyttig-socket volume) and the mTLS port; the
              # healthcheck uses the socket.
              docker run -d --name smoke --read-only --cap-drop ALL --tmpfs /tmp \
                --tmpfs /run/nyttig:uid=10001,gid=10001,mode=0700 \
                -v "$RUNNER_TEMP/certs:/certs:ro" --health-interval 2s "nyttig-ci/$TARGET" \
                --socket /run/nyttig/nyttig.sock --db-path /var/lib/nyttig/nyttig.db \
                --tls-listen :9090 --tls-cert /certs/server.pem --tls-key /certs/server.key \
                --tls-client-ca /certs/ca.pem
              ;;
            nyttig-api)
              "${run[@]}" "nyttig-ci/$TARGET" -version
              exit 0
              ;;
            nyttig-web)
              docker run -d --name smoke --read-only --cap-drop ALL --tmpfs /tmp \
                --health-interval 2s -e ORIGIN=http://localhost:3000 "nyttig-ci/$TARGET"
              ;;
          esac
          for _ in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs smoke
          [ "$status" = healthy ] || { echo "::error::$TARGET is $status"; exit 1; }
          if [ "$TARGET" = nyttigd ]; then
            docker exec smoke nyttig list-sources --socket 127.0.0.1:9090 \
              --tls-cert /certs/client.pem --tls-key /certs/client.key --tls-ca /certs/ca.pem
            # A client certificate from another CA must fail the handshake.
            if docker exec smoke nyttig list-sources --socket 127.0.0.1:9090 --tls-ca /certs/ca.pem \
                --tls-cert /certs/other/client.pem --tls-key /certs/other/client.key; then
              echo "::error::the mTLS port accepted a client certificate from an untrusted CA"; exit 1
            fi
          fi

  # Runs only for a v* tag, after everything else has passed: pushes
  # ghcr.io/<owner>/<target>:<version> (and <major>.<minor> and latest for a
  # stable release) with a build provenance attestation:
  #   gh attestation verify oci://ghcr.io/sonhal/nyttigd:0.5.0 --repo sonhal/nyttig
  # The first push creates the packages as private; make them public once in
  # the package settings.
  publish-images:
    name: Publish image (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [lint, generated, test, web, build, vulncheck, images]
    strategy:
      matrix:
        target: [nyttigd, nyttig-api, nyttig-web]
    permissions:
      contents: read
      packages: write     # push to ghcr.io
      id-token: write     # sign the build provenance attestation
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # v0.5.0 → 0.5.0, 0.5 and latest; a pre-release (a hyphen) gets only
      # its full version. The tag is passed explicitly because this run is
      # usually a workflow_dispatch from the Tag release job.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha,scope=image-${{ matrix.target }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: golang/govulncheck-action@v1
        with:
          # The action defaults go-version-input to "stable", which setup-go
          # prefers over go-version-file. Clear it so the scan uses the same
          # toolchain as go.mod, and so the standard library it checks is the
          # one the binaries are actually built with.
          go-version-input: ""
          go-version-file: go.mod
          go-package: ./...

  # Runs on pushes to main once everything else has passed. If the commits
  # since the last release ask for one (scripts/next-version.sh reads their
  # Conventional Commits subjects), it tags this commit and starts the release.
  #
  # A tag pushed with GITHUB_TOKEN doesn't trigger workflows, so the push
  # alone would never reach the Release job. workflow_dispatch is the one
  # event GITHUB_TOKEN may start, so the job dispatches this workflow on the
  # new tag: that run has github.ref = refs/tags/vX.Y.Z, exactly like a tag
  # pushed by hand.
  tag:
    name: Tag release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, generated, test, web, build, vulncheck, images]
    # One at a time, so two quick merges can't compute the same version. A
    # queued run that GitHub replaces with a newer one loses nothing: the
    # newer run reads every commit since the last tag.
    concurrency:
      group: ${{ github.workflow }}-tag
      cancel-in-progress: false
    permissions:
      contents: write   # push the tag
      actions: write    # dispatch the release run
    steps:
      # Full history and tags (fetched now, after the concurrency wait, so a
      # tag the previous run pushed is seen).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          # Already released: tagged by hand, or a later commit's run got
          # here first and its tag covers this commit.
          if released=$(git tag --contains HEAD --list 'v*' | head -n 1) && [ -n "$released" ]; then
            echo "Already released in $released"
            exit 0
          fi
          version=$(scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Release: ${version:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Push tag and start release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
          gh workflow run ci.yml --ref "$TAG"

  # Runs only for a v* tag, after everything else has passed. Publishes one
  # bundle with everything the server needs, laid out for deploy/README.md:
  #
  #   nyttig-<tag>-linux-amd64/
  #     bin/      nyttigd, nyttig, nyttig-api
  #     web/      build/ and package.json (the nyttig-web Node server)
  #     deploy/   systemd units, Caddyfile, README.md
  #     sample_config.toml
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [lint, generated, test, web, build, vulncheck, images]
    permissions:
      contents: write     # create the release
      id-token: write     # sign the build provenance attestation
      attestations: write
    env:
      BUNDLE: nyttig-${{ github.ref_name }}-linux-amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: nyttig-linux-amd64
          path: ${{ env.BUNDLE }}/bin

      - uses: actions/download-artifact@v8
        with:
          name: nyttig-web
          path: ${{ env.BUNDLE }}/web

      # Artifacts don't keep file modes, so the binaries come back without the
      # execute bit. The tarball is reproducible: sorted, root-owned entries
      # stamped with the tagged commit's time.
      - name: Assemble bundle
        run: |
          chmod 0755 "$BUNDLE"/bin/*
          cp -r deploy sample_config.toml "$BUNDLE"/
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" \
            -czf "$BUNDLE.tar.gz" "$BUNDLE"
          sha256sum "$BUNDLE.tar.gz" > SHA256SUMS
          cat SHA256SUMS
          tar -tvzf "$BUNDLE.tar.gz"

      # Proves the tarball was built by this workflow from this commit:
      #   gh attestation verify <tarball> --repo sonhal/nyttig
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.BUNDLE }}.tar.gz

      # A tag with a hyphen (v0.2.0-rc.1) is marked as a pre-release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" "$BUNDLE.tar.gz" SHA256SUMS \
            --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}"
