name: CI

on:
  push:
    branches: [main]
    # A version tag runs the whole pipeline and then publishes a GitHub
    # Release with the deployable bundle (the release job at the end).
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only need to read the repo. golangci-lint's
# only-new-issues additionally reads the PR diff through the API.
permissions:
  contents: read

# Cancel superseded runs on the same PR/branch, but never on main so every
# commit there gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '^third_party/'))
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # The codebase has existing findings; only fail on ones a change
          # introduces. Drop this once the backlog is cleared.
          only-new-issues: true

  generated:
    name: Generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Pinned to the versions in buf.gen.yaml's header comment. Keep them in
      # sync when bumping, or this job reports a diff.
      - name: Install buf and protoc plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      # protobuf-go serializes from the descriptor embedded in the generated
      # code, so a hand edit to *.pb.go silently drops fields on the wire.
      - name: Check generated code is up to date
        run: |
          buf generate
          if ! git diff --exit-code -- internal/proto; then
            echo "::error::internal/proto is out of date with proto/. Run 'buf generate' and commit the result."
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # SQLite is compiled in through cgo; the race detector needs it too.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go test
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  web:
    name: Web
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned by web/package.json's packageManager.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The end-to-end tests build and run nyttigd and nyttig-api.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm check

      - name: vitest
        run: pnpm test

      - name: vite build
        run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm test:e2e

      # The SvelteKit Node server (deploy/systemd/nyttig-web.service).
      - uses: actions/upload-artifact@v7
        with:
          name: nyttig-web
          path: |
            web/build/
            web/package.json
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, web]
    # nyttigd uses cgo, so it only runs where glibc is the same version as the
    # one it was built against or newer. Build on the servers' Debian release
    # (deploy/README.md) instead of the runner's Ubuntu.
    container: golang:1.26-trixie
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      # The workspace is owned by the runner's user, not the container's root;
      # without this git refuses it and go build can't stamp VCS info.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The image's Go may be older than go.mod's toolchain line; the go
      # command then downloads that toolchain itself (GOTOOLCHAIN=auto).
      # A v* tag is stamped in as the version (nyttigd -version, and the
      # startup logs); other builds report the git pseudo-version go build
      # records (internal/version).
      - name: go build
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X github.com/sonhal/nyttig/internal/version.Version=$VERSION" \
            -o dist/ ./cmd/nyttig ./cmd/nyttigd ./cmd/nyttig-api
          dist/nyttigd -version

      - uses: actions/upload-artifact@v7
        with:
          name: nyttig-linux-amd64
          path: dist/
          retention-days: 14

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: golang/govulncheck-action@v1
        with:
          # The action defaults go-version-input to "stable", which setup-go
          # prefers over go-version-file. Clear it so the scan uses the same
          # toolchain as go.mod, and so the standard library it checks is the
          # one the binaries are actually built with.
          go-version-input: ""
          go-version-file: go.mod
          go-package: ./...

  # Runs only for a v* tag, after everything else has passed. Publishes one
  # bundle with everything the server needs, laid out for deploy/README.md:
  #
  #   nyttig-<tag>-linux-amd64/
  #     bin/      nyttigd, nyttig, nyttig-api
  #     web/      build/ and package.json (the nyttig-web Node server)
  #     deploy/   systemd units, Caddyfile, README.md
  #     sample_config.toml
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [lint, generated, test, web, build, vulncheck]
    permissions:
      contents: write     # create the release
      id-token: write     # sign the build provenance attestation
      attestations: write
    env:
      BUNDLE: nyttig-${{ github.ref_name }}-linux-amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: nyttig-linux-amd64
          path: ${{ env.BUNDLE }}/bin

      - uses: actions/download-artifact@v7
        with:
          name: nyttig-web
          path: ${{ env.BUNDLE }}/web

      # Artifacts don't keep file modes, so the binaries come back without the
      # execute bit. The tarball is reproducible: sorted, root-owned entries
      # stamped with the tagged commit's time.
      - name: Assemble bundle
        run: |
          chmod 0755 "$BUNDLE"/bin/*
          cp -r deploy sample_config.toml "$BUNDLE"/
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" \
            -czf "$BUNDLE.tar.gz" "$BUNDLE"
          sha256sum "$BUNDLE.tar.gz" > SHA256SUMS
          cat SHA256SUMS
          tar -tvzf "$BUNDLE.tar.gz"

      # Proves the tarball was built by this workflow from this commit:
      #   gh attestation verify <tarball> --repo sonhal/nyttig
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.BUNDLE }}.tar.gz

      # A tag with a hyphen (v0.2.0-rc.1) is marked as a pre-release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" "$BUNDLE.tar.gz" SHA256SUMS \
            --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}"
