name: CI

on:
  push:
    branches: [main]
    # A version tag runs the whole pipeline and then publishes a GitHub
    # Release with the deployable bundle (the release job at the end).
    tags: ['v*']
  pull_request:
  # Also how the Tag job starts the release run for the tag it pushes.
  workflow_dispatch:

# Least privilege: jobs only need to read the repo. golangci-lint's
# only-new-issues additionally reads the PR diff through the API.
permissions:
  contents: read

# Cancel superseded runs on the same PR/branch, but never on main so every
# commit there gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      # Skipped for v* tags: only-new-issues needs a baseline (the PR base or
      # the push's previous commit), and a new tag has none, so the action
      # would lint the whole codebase and fail on the existing backlog. The
      # tagged commit was already linted on its PR and its push to main.
      - name: golangci-lint
        if: github.ref_type != 'tag'
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # The codebase has existing findings; only fail on ones a change
          # introduces. Drop this once the backlog is cleared.
          only-new-issues: true

  generated:
    name: Generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Pinned to the versions in buf.gen.yaml's header comment. Keep them in
      # sync when bumping, or this job reports a diff.
      - name: Install buf and protoc plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      # protobuf-go serializes from the descriptor embedded in the generated
      # code, so a hand edit to *.pb.go silently drops fields on the wire.
      - name: Check generated code is up to date
        run: |
          buf generate
          if ! git diff --exit-code -- internal/proto; then
            echo "::error::internal/proto is out of date with proto/. Run 'buf generate' and commit the result."
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # SQLite is compiled in through cgo; the race detector needs it too.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # sqlite_fts5 compiles go-sqlite3's bundled SQLite with FTS5, which the
      # schema needs; the release build links the server's libsqlite3 instead
      # (the Build job below).
      - name: go test
        run: go test -race -shuffle=on -tags sqlite_fts5 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  web:
    name: Web
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned by web/package.json's packageManager.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The end-to-end tests build and run nyttigd and nyttig-api.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm check

      - name: vitest
        run: pnpm test

      - name: vite build
        run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm test:e2e

      # The SvelteKit Node server (deploy/systemd/nyttig-web.service).
      - uses: actions/upload-artifact@v7
        with:
          name: nyttig-web
          path: |
            web/build/
            web/package.json
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, web]
    # nyttigd uses cgo and, with the libsqlite3 tag below, the system's
    # SQLite, so it only runs where glibc and libsqlite3 are the same version
    # as the ones it was built against or newer. Build on the servers' Debian
    # release (deploy/README.md) instead of the runner's Ubuntu.
    container: golang:1.26-trixie
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      # The workspace is owned by the runner's user, not the container's root;
      # without this git refuses it and go build can't stamp VCS info.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Headers for the libsqlite3 build tag. Debian's libsqlite3 is built
      # with FTS5; nyttigd checks that at startup.
      - name: Install libsqlite3-dev
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev

      # The image's Go may be older than go.mod's toolchain line; the go
      # command then downloads that toolchain itself (GOTOOLCHAIN=auto).
      # A v* tag is stamped in as the version (nyttigd -version, and the
      # startup logs); other builds report the git pseudo-version go build
      # records (internal/version).
      #
      # -tags libsqlite3 links the system SQLite (package libsqlite3-0 on the
      # server, which apt keeps patched) instead of compiling go-sqlite3's
      # bundled copy into the binary.
      - name: go build
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          mkdir -p dist
          go build -trimpath -tags libsqlite3 \
            -ldflags="-s -w -X github.com/sonhal/nyttig/internal/version.Version=$VERSION" \
            -o dist/ ./cmd/nyttig ./cmd/nyttigd ./cmd/nyttig-api
          dist/nyttigd -version
          # Prove nyttigd links the system library rather than a bundled copy.
          ldd dist/nyttigd | grep -q libsqlite3

      - uses: actions/upload-artifact@v7
        with:
          name: nyttig-linux-amd64
          path: dist/
          retention-days: 14

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: golang/govulncheck-action@v1
        with:
          # The action defaults go-version-input to "stable", which setup-go
          # prefers over go-version-file. Clear it so the scan uses the same
          # toolchain as go.mod, and so the standard library it checks is the
          # one the binaries are actually built with.
          go-version-input: ""
          go-version-file: go.mod
          go-package: ./...

  # Runs on pushes to main once everything else has passed. If the commits
  # since the last release ask for one (scripts/next-version.sh reads their
  # Conventional Commits subjects), it tags this commit and starts the release.
  #
  # A tag pushed with GITHUB_TOKEN doesn't trigger workflows, so the push
  # alone would never reach the Release job. workflow_dispatch is the one
  # event GITHUB_TOKEN may start, so the job dispatches this workflow on the
  # new tag: that run has github.ref = refs/tags/vX.Y.Z, exactly like a tag
  # pushed by hand.
  tag:
    name: Tag release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, generated, test, web, build, vulncheck]
    # One at a time, so two quick merges can't compute the same version. A
    # queued run that GitHub replaces with a newer one loses nothing: the
    # newer run reads every commit since the last tag.
    concurrency:
      group: ${{ github.workflow }}-tag
      cancel-in-progress: false
    permissions:
      contents: write   # push the tag
      actions: write    # dispatch the release run
    steps:
      # Full history and tags (fetched now, after the concurrency wait, so a
      # tag the previous run pushed is seen).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          # Already released: tagged by hand, or a later commit's run got
          # here first and its tag covers this commit.
          if released=$(git tag --contains HEAD --list 'v*' | head -n 1) && [ -n "$released" ]; then
            echo "Already released in $released"
            exit 0
          fi
          version=$(scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Release: ${version:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Push tag and start release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
          gh workflow run ci.yml --ref "$TAG"

  # Runs only for a v* tag, after everything else has passed. Publishes one
  # bundle with everything the server needs, laid out for deploy/README.md:
  #
  #   nyttig-<tag>-linux-amd64/
  #     bin/      nyttigd, nyttig, nyttig-api
  #     web/      build/ and package.json (the nyttig-web Node server)
  #     deploy/   systemd units, Caddyfile, README.md
  #     sample_config.toml
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [lint, generated, test, web, build, vulncheck]
    permissions:
      contents: write     # create the release
      id-token: write     # sign the build provenance attestation
      attestations: write
    env:
      BUNDLE: nyttig-${{ github.ref_name }}-linux-amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: nyttig-linux-amd64
          path: ${{ env.BUNDLE }}/bin

      - uses: actions/download-artifact@v7
        with:
          name: nyttig-web
          path: ${{ env.BUNDLE }}/web

      # Artifacts don't keep file modes, so the binaries come back without the
      # execute bit. The tarball is reproducible: sorted, root-owned entries
      # stamped with the tagged commit's time.
      - name: Assemble bundle
        run: |
          chmod 0755 "$BUNDLE"/bin/*
          cp -r deploy sample_config.toml "$BUNDLE"/
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" \
            -czf "$BUNDLE.tar.gz" "$BUNDLE"
          sha256sum "$BUNDLE.tar.gz" > SHA256SUMS
          cat SHA256SUMS
          tar -tvzf "$BUNDLE.tar.gz"

      # Proves the tarball was built by this workflow from this commit:
      #   gh attestation verify <tarball> --repo sonhal/nyttig
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.BUNDLE }}.tar.gz

      # A tag with a hyphen (v0.2.0-rc.1) is marked as a pre-release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" "$BUNDLE.tar.gz" SHA256SUMS \
            --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}"
